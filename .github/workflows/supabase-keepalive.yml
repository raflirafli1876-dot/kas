# Ping Supabase tiap 3 hari biar project Free tidak di-pause otomatis
# (project Free di-pause setelah 1 minggu tanpa aktivitas).
# Cara pakai: push file ini ke GitHub, Actions akan jalan otomatis sesuai jadwal.
# Tidak perlu secret tambahan — anon key di bawah sama dengan yang sudah
# publik di daftar_kelas.html (hanya boleh SELECT 1 baris).
name: Supabase Keepalive

on:
  schedule:
    - cron: "0 8 */3 * *" # tiap 3 hari jam 08:00 UTC
  workflow_dispatch: {} # tombol run manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping kas_kelas_anggota (SELECT 1 row)
        run: |
          curl -sf -o /dev/null \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/kas_kelas_anggota?select=id&limit=1"
          echo "Supabase masih hidup ✓"
